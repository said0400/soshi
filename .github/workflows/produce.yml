name: 🎬 Produce videos

# الإنتاج فقط. النشر يتولاه Cloudflare Worker (مجلد worker/) كل دقيقة.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "اللغة"
        type: choice
        default: all
        options: [all, ar, fr, en, es]
      mode:
        description: "النوع"
        type: choice
        default: all
        options: [all, short, long]
      max_videos:
        description: "أقصى عدد فيديوهات لكل لغة"
        type: string
        default: "3"
      force_ai:
        description: "إعادة توليد نتائج الذكاء الاصطناعي؟"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── 1) خفيف: أي لغة عندها موعد دخل نافذة الإنتاج؟ ─────────────────────────
  plan:
    name: 🔎 Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      langs: ${{ steps.pick.outputs.langs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install minimal deps
        run: pip install requests boto3 openpyxl

      - name: Pick languages
        id: pick
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          EVENT:                ${{ github.event_name }}
          IN_LANG:              ${{ inputs.lang }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_LANG" = "all" ] || [ -z "$IN_LANG" ]; then
              echo 'langs=["ar","fr","en","es"]' >> "$GITHUB_OUTPUT"
            else
              echo "langs=[\"$IN_LANG\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            python main.py due
          fi

  # ── 2) ثقيل: لغة واحدة لكل job (concurrency لكل لغة) ───────────────────────
  produce:
    name: 🎬 Produce ${{ matrix.lang }}
    needs: plan
    if: needs.plan.outputs.langs != '[]' && needs.plan.outputs.langs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.plan.outputs.langs) }}
    concurrency:
      group: produce-${{ matrix.lang }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 🔧 System dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-core fonts-hosny-amiri fonts-sil-scheherazade
          sudo fc-cache -f

      - name: 💾 Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/faster-whisper
          key: faster-whisper-medium-v1

      - name: 📦 Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Node dependencies
        working-directory: remotion
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 🌐 Chromium (Playwright 1.50.0 — مشترك بين Python وNode)
        working-directory: remotion
        run: npx playwright install chromium --with-deps

      - name: ✅ Environment check
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:      ${{ secrets.PIXABAY_API_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:   ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python main.py check || true

      - name: 🎬 Produce
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:      ${{ secrets.PIXABAY_API_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:   ${{ secrets.R2_PUBLIC_BASE_URL }}
          LANG_CODE:            ${{ matrix.lang }}
          IN_MODE:              ${{ inputs.mode }}
          IN_MAX:               ${{ inputs.max_videos }}
          IN_FORCE_AI:          ${{ inputs.force_ai }}
        run: |
          FLAGS=""
          [ "$IN_FORCE_AI" = "true" ] && FLAGS="--force-ai"
          python main.py produce --lang "$LANG_CODE" --mode "${IN_MODE:-all}" \
            --max-videos "${IN_MAX:-3}" $FLAGS
